apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
  namespace: webapps

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: boardgame

  template:
    metadata:
      labels:
        app: boardgame

    spec:
      containers:
        - name: boardgame
          image: gajendra1/boardshack:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: boardgame-ssvc
  namespace: webapps

spec:
  type: LoadBalancer

  selector:
    app: boardgame

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30007